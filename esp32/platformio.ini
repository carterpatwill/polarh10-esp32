[env:xiao-esp32s3-polar]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; Seeed XIAO ESP32-S3 = ESP32-S3R8: dual-core LX7 @ 240 MHz, 8 MB flash, 8 MB octal (OPI) PSRAM.
board_build.mcu        = esp32s3
board_build.f_cpu      = 240000000L
board_build.flash_mode = qio
board_build.psram_type = opi

; BLE-only local-logging build: custom partition table carves out a ~4.9 MB
; LittleFS region for session recordings (see partitions.csv).
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

upload_speed   = 921600
monitor_speed  = 115200

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; This branch records to onboard flash on battery; on USB plug-in it brings WiFi
; up in "sync mode" and pushes the stored recordings to the Pi over MQTT (TLS to
; HiveMQ), in the JSON shape the Pi's server.py expects.
lib_deps =
    h2zero/NimBLE-Arduino@^2.0.0
    knolleary/PubSubClient@^2.8
